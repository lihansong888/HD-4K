name: Android build

on:
  push:
    branches:
      - official-2023
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Fetch androidx/media sources to /media (the app expects them there)
        run: |
          sudo git clone --depth 1 --branch 1.1.1 https://github.com/androidx/media.git /media
          ls /media | head -30
          sudo chmod -R a+rwX /media

      - name: Fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp keystore/fusiontv-debug.keystore ~/.android/debug.keystore || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Build
        run: gradle :app:assembleLeanbackJavaArm64_v8aDebug :app:assembleLeanbackJavaArmeabi_v7aDebug --no-daemon --stacktrace

      - name: List APKs
        run: find app/build/outputs -name '*.apk' | sort

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A64=$(find app/build/outputs -name '*Arm64_v8a*.apk' -o -name '*arm64_v8a*.apk' | head -n1)
          A32=$(find app/build/outputs -name '*Armeabi_v7a*.apk' -o -name '*armeabi_v7a*.apk' | head -n1)
          echo "$A64"; echo "$A32"
          cp "$A64" fusiontv-arm64.apk
          cp "$A32" fusiontv-v7a.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest fusiontv-arm64.apk fusiontv-v7a.apk --prerelease --title "Test build" --notes "Debug test build from ${GITHUB_SHA}" --target "${GITHUB_SHA}"

