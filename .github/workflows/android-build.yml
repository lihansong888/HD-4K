name: Android build

on:
  push:
    branches:
      - fusion-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools" || true

      - name: Prepare fixed signing key
        shell: bash
        run: |
          printf 'storeFile=%s\nkeyAlias=androiddebugkey\nstorePassword=android\n' "$GITHUB_WORKSPACE/keystore/fusiontv-debug.keystore" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TV APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackDebug --no-daemon

      - name: List APKs
        run: find app/build/outputs -name '*.apk' | sort

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          A64=$(find app/build/outputs -name '*leanback*arm64-v8a*debug*.apk' | head -n 1)
          A32=$(find app/build/outputs -name '*leanback*armeabi-v7a*debug*.apk' | head -n 1)
          test -s "$A64"; test -s "$A32"
          cp "$A64" fusiontv-arm64.apk
          cp "$A32" fusiontv-arm32.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest fusiontv-arm64.apk fusiontv-arm32.apk --prerelease --title "Test build" --notes "Debug test build from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
