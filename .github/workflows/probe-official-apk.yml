name: Probe official APK

on:
  push:
    branches:
      - fusion-dev
    paths:
      - ".github/workflows/probe-official-apk.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List official release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v5.7.1 -R FongMi/Release --json assets -q '.assets[]|"\(.name) \(.size)"' | tee assets.txt
      - name: Download leanback arm64 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(grep -iE 'leanback.*arm64.*\.apk|arm64.*leanback.*\.apk' assets.txt | head -n1 | cut -d' ' -f1)
          echo "picked: $NAME"
          gh release download v5.7.1 -R FongMi/Release -p "$NAME" -O official.apk
          ls -la official.apk
      - name: Inspect
        run: |
          unzip -l official.apk | awk '{print $4}' | grep -E '^(classes[0-9]*\.dex|lib/|resources\.arsc|AndroidManifest)' | head -60
          unzip -l official.apk | tail -1
