name: Probe official APK

on:
  push:
    branches:
      - fusion-dev
    paths:
      - ".github/workflows/probe-official-apk.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download official APK 5.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 5.9.0 -R FongMi/Release -p 'leanback-arm64_v8a.apk' -O official.apk
          ls -la official.apk
      - name: Inspect
        run: |
          echo "== top-level layout"; unzip -l official.apk | awk '{print $4}' | grep -E '^(classes[0-9]*\.dex|lib/|resources\.arsc|AndroidManifest|assets/)' | sed 's#\(assets/[^/]*\)/.*#\1/#' | sort | uniq -c | head -40
          echo "== native libs"; unzip -l official.apk | awk '{print $4}' | grep '^lib/' | head -40
          echo "== versionName in source"; grep -rn "versionName\|VERSION_NAME" app/build.gradle | head -3
          echo "== dex classes mentioning media3 mpvplayer / libass / danmaku"
          mkdir x && cd x && unzip -q ../official.apk 'classes*.dex' && for d in classes*.dex; do echo $d $(strings -n 8 $d | grep -c 'androidx/media3/mpvplayer'); done
          strings -n 8 classes*.dex | grep -E 'androidx/media3/(mpvplayer|exoplayer/libass|ui/danmaku|decoder/ffmpeg)/' | sed 's#/[^/]*;*$##' | sort -u | head -20
