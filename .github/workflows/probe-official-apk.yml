name: Probe official APK

on:
  push:
    branches:
      - fusion-dev
    paths:
      - ".github/workflows/probe-official-apk.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== FongMi/Release"; gh release list -R FongMi/Release --limit 15 || true
          echo "== FongMi/TV"; gh release list -R FongMi/TV --limit 15 || true
          echo "== assets of latest in FongMi/Release"
          T=$(gh release list -R FongMi/Release --limit 1 --json tagName -q '.[0].tagName' || true); echo "tag=$T"
          [ -n "$T" ] && gh release view "$T" -R FongMi/Release --json assets -q '.assets[]|"\(.name) \(.size)"' || true
          echo "== assets of latest in FongMi/TV"
          T2=$(gh release list -R FongMi/TV --limit 1 --json tagName -q '.[0].tagName' || true); echo "tag=$T2"
          [ -n "$T2" ] && gh release view "$T2" -R FongMi/TV --json assets -q '.assets[]|"\(.name) \(.size)"' || true
